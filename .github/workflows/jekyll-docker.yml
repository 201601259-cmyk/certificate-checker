<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Verification</title>
  <style>
    /* Background Styling */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      /* Subtle dark gradient background */
      background: linear-gradient(135deg, #1e1e2f, #11111d);
      color: #ffffff;
    }

    /* Translucent Centered Box */
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #cccccc;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #444;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      outline: none;
      transition: border 0.3s;
    }

    input[type="text"]:focus {
      border-color: #007bff;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #007bff;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Result Messages */
    #result {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.1rem;
      min-height: 24px;
    }

    .valid {
      color: #28a745;
    }

    .invalid {
      color: #dc3545;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Verify Certificate</h2>
    <div class="form-group">
      <label for="certNumber">Please enter your certificate number:</label>
      <input type="text" id="certNumber" placeholder="e.g. CERT-1001" autocomplete="off" />
    </div>
    <button onclick="verifyCertificate()">Verify</button>
    <div id="result"></div>
  </div>

  <script>
    // Add valid certificate numbers to this list:
    const validCertificates = [
      "CERT-1001",
      "CERT-1002",
      "CERT-1003",
      "CERT-2026-A"
    ];

    function verifyCertificate() {
      const input = document.getElementById("certNumber").value.trim();
      const resultDiv = document.getElementById("result");

      if (!input) {
        resultDiv.className = "";
        resultDiv.textContent = "Please enter a certificate number.";
        return;
      }

      // Check if input exists in list (case-insensitive)
      const isValid = validCertificates.some(
        cert => cert.toLowerCase() === input.toLowerCase()
      );

      if (isValid) {
        resultDiv.className = "valid";
        resultDiv.textContent = "This is a valid certificate";
      } else {
        resultDiv.className = "invalid";
        resultDiv.textContent = "Not valid";
      }
    }
  </script>
</body>
</html>
